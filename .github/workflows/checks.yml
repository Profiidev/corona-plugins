name: Checks and Validation
on:
  pull_request:

jobs:
  linters:
    name: Run linters
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: bahmutov/npm-install@v1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # gpui-kit.d.ts is gitignored, tsc needs each plugin's own
      - name: Generate plugin types
        run: nix run github:Profiidev/corona/latest --accept-flake-config -- types $(dirname */plugin.toml)

      - name: Run linters
        uses: profiidev/rust-lint-action@16801b02ca2bc0441e458d7f713d8a0e8d417927 # v4
        with:
          auto_fix: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          continue_on_error: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          results_file: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'lint-results.json' || '' }}
          oxfmt: true
          oxlint: true
          tsc: true
          # each plugin is its own project (per-plugin corona/settings types), the action runs tsc only once
          tsc_command_prefix: >-
            sh -c 'r=0; for p in */tsconfig.json; do npx --no-install "$@" -p "$p" || r=1; done; exit $r' sh
          git_sign_commits: true
          github_token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Upload lint results
        if: always() && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-results
          path: lint-results.json
          retention-days: 5
